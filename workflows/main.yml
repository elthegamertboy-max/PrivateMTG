name: Build MTG Cards JSON

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # tous les dimanches à minuit UTC

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Run script to build MTGCards.json
        run: node processCards.js

      - name: Commit and push MTGCards.json if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add MTGCards.json Game_MTG.json cardFr.json
          git diff --cached --quiet || git commit -m "Update MTGCards.json from Scryfall API"
          git push

      - name: Upload MTGCards.json as artifact
        uses: actions/upload-artifact@v4
        with: 
          name: MTG_JSON_Files
          path: |
            MTGCards.json
            Game_MTG.json
            cardFr.json
